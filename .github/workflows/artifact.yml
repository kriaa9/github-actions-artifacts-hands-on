name: Workflow Demo

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create a text file
      run: echo "Hello, world!" > hello.txt

    - name: Archive text file
      uses: actions/upload-artifact@v4
      with:
        name: hello-artifact
        path: hello.txt

  # Nouveau job ajouté ci-dessous
  download:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download text file
      uses: actions/download-artifact@v4
      with:
        name: hello-artifact
        path: ./artifacts  # Ensure this is exactly ./artifacts

    - name: Display content of the text file
      run: cat ./artifacts/hello.txt  # Use the exact path and command
